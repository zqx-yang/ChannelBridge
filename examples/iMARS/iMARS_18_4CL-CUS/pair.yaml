# ChannelBridge pair file -- 4CL (upstream) to CUS (downstream).
#
# GENERATED by run_examples.py from enzymes.tsv and pairs.tsv; edit
# those, not this. One of the 19 pairs of the iMARS fusion set.
#
# Neither structure is the iMARS construct: both are homologous
# deposited entries (see enzymes.tsv for the search that found them,
# and the score, which is how much the homology is worth).
#
# Tunnel source: MIXED -- 4CL is annotated in ChannelsDB and its tunnels are fetched, CUS is not and CAVER is run on it.

name: iMARS_18_4CL-CUS

# What travels between them: the upstream enzyme's product.
channelled: 4-coumaroyl-CoA

# O_IC is measured at the UPSTREAM exit only, so this is not cosmetic.
upstream: 1

targets:
  - id: 1
    name: enz_4CL                 # 4CL
    file: input/enz_4CL.pdb
    chain: A                       # 5BSM chain A, renamed at prep
    ligands: [ATP]
    channel_ligand: ATP
    site: "resn ATP"
    vent: "resn ATP"
    # ChannelsDB branch: the tunnels come from entry 5BSM
    # (27 tunnels, Cofactor). Nothing is computed, and nothing
    # may move the coordinates -- their chain is in this
    # entry's frame.
    # adenylate-forming; the ATP site is the one annotated
  - id: 2
    name: enz_CUS                 # CUS
    file: input/enz_CUS.pdb
    chain: B                       # 3ALE chain A, renamed at prep
    site: "resi 174+316+349"
    vent: "resi 174+316+349"
    # No ligand marks this site, so site/vent name the
    # catalytic residues instead. Narrow them to the
    # reactive atom if you know which it is.
    caver:
      exclude: [HOH, WAT]
      probe_radius: 1.4
      shell_radius: 10
      shell_depth: 6
      clustering_threshold: 3.5
      seed: 1
      # Derived, not written by hand: the centroid of the
      # residues below sits inside an atom, and CAVER then
      # finds zero tunnels without saying why. See
      # channelbridge.caver.cavity_start_point.
      #   chbridge caver config --structure input/enz_CUS.pdb \
      #       --start-cavity A:174,A:316,A:349
    # no annotated entry in 12 candidates. Triad from CHS 1BI5 (52% id);
    # matches the published Oryza CUS numbering independently

# Normalisation is what makes the geometry independent of the CAVER
# build or the database that produced the chain. See
# docs/caver-builds.md for the measurement behind each number.
tunnel:
  normalise: true
  spacing: 1.0
  burial_min: 15
  burial_radius: 8.0
  persist: 2.0
  oic_arm: 1.0

# The published DO coefficients. Nothing here is tuned per pair.
do_coefficients: imars-fig2c

# Left at the package defaults on purpose: this set is for exercising
# the tunnel stages, and a per-pair search grid would be a claim
# about these enzymes that nobody here has earned.

