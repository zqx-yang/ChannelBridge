# ChannelBridge pair file -- GPPS (upstream) to LIC (downstream).
#
# GENERATED by run_examples.py from inputs.tsv, enzymes.tsv and
# pairs.tsv; edit those, not this. One of the 19 pairs of the iMARS
# fusion set.
#
# Neither structure is the iMARS construct. The paper's enzymes are
# plant and yeast proteins and almost none has a structure of its
# own, so each side here is a homologous deposited entry or a model:
#   upstream   afdb_Q8LKJ2_v6.cif (afdb), superseding the 3KRF of the first structure search
#   downstream 2ONG.cif (pdb-other), superseding the 1N1B of the first structure search
# enzymes.tsv records the search that found the homolog and its
# score, which is how much the homology is worth.
#
# Tunnel source: CAVER for both.

name: iMARS_03_GPPS-LIC

# What travels between them: the upstream enzyme's product.
channelled: GPP

# O_IC is measured at the UPSTREAM exit only, so this is not cosmetic.
upstream: 1

targets:
  - id: 1
    name: enz_GPPS                 # GPPS
    file: input/enz_GPPS.pdb
    chain: A                       # afdb_Q8LKJ2_v6.cif chain A, renamed at prep
    # Not 3KRF: that is the homolog the first structure
    # search settled on, and this file replaced it.
    site: "resi 164+165+168+169+174+176+179+238+242+245+266+267+331"
    vent: "resi 164+165+168+169+174+176+179+238+242+245+266+267+331"
    # No ligand marks this site, so site/vent name the
    # catalytic residues instead. Narrow them to the
    # reactive atom if you know which it is.
    caver:
      exclude: [HOH, WAT]
      probe_radius: 1.4
      shell_radius: 10
      shell_depth: 6
      clustering_threshold: 3.5
      seed: 1
      # Derived, not written by hand: the centroid of the
      # residues below sits inside an atom, and CAVER then
      # finds zero tunnels without saying why. See
      # channelbridge.caver.cavity_start_point.
      #   chbridge caver config --structure input/enz_GPPS.pdb \
      #       --start-cavity 164,165,168,169,174,176,179,238,242,245,266,267,331
    # chain D, not A: 9 of the 11 annotated Procognate tunnels are in
    # chain D, none in A
  - id: 2
    name: enz_LIC                 # LIC
    file: input/enz_LIC.pdb
    chain: B                       # 2ONG.cif chain A, renamed at prep
    # Not 1N1B: that is the homolog the first structure
    # search settled on, and this file replaced it.
    ligands: [F3P]
    channel_ligand: F3P
    site: "resn F3P"
    vent: "resn F3P"
    caver:
      exclude: [HOH, WAT, F3P]
      probe_radius: 1.4
      shell_radius: 10
      shell_depth: 6
      clustering_threshold: 3.5
      seed: 1
      # Start point: the centroid of ONE F3P copy, in
      # the chain whose channel this is. Not the mean
      # over copies -- that lands between two sites and
      # in neither. See run_examples._cargo_seed.
    # DISTANT homolog (0.46): family-level evidence only; chain B, not
    # A: 18 annotated CSA tunnels in chain B against 4 in A

# Normalisation is what makes the geometry independent of the CAVER
# build or the database that produced the chain. See
# docs/caver-builds.md for the measurement behind each number.
tunnel:
  normalise: true
  spacing: 1.0
  burial_min: 15
  burial_radius: 8.0
  persist: 2.0
  oic_arm: 1.0

# The published DO coefficients. Nothing here is tuned per pair.
do_coefficients: imars-fig2c

# Left at the package defaults on purpose: this set is for exercising
# the tunnel stages, and a per-pair search grid would be a claim
# about these enzymes that nobody here has earned.

