# ChannelBridge pair file -- GGPPS (upstream) to AS (downstream).
#
# GENERATED by run_examples.py from inputs.tsv, enzymes.tsv and
# pairs.tsv; edit those, not this. One of the 19 pairs of the iMARS
# fusion set.
#
# Neither structure is the iMARS construct. The paper's enzymes are
# plant and yeast proteins and almost none has a structure of its
# own, so each side here is a homologous deposited entry or a model:
#   upstream   af3_GGPPS.cif (af3), superseding the 2E8T of the first structure search
#   downstream 3S9V.cif (pdb)
# enzymes.tsv records the search that found the homolog and its
# score, which is how much the homology is worth.
#
# Tunnel source: MIXED -- AS is annotated in ChannelsDB and its tunnels are fetched, GGPPS is not and CAVER is run on it.

name: iMARS_14_GGPPS-AS

# What travels between them: the upstream enzyme's product.
channelled: GGPP

# O_IC is measured at the UPSTREAM exit only, so this is not cosmetic.
upstream: 1

targets:
  - id: 1
    name: enz_GGPPS                 # GGPPS
    file: input/enz_GGPPS.pdb
    chain: A                       # af3_GGPPS.cif chain A, renamed at prep
    # Not 2E8T: that is the homolog the first structure
    # search settled on, and this file replaced it.
    site: "resi 90+91+94+95+97+98+101+102+107+130+158+161+162+165+168+192+193+196+229+232+233+246+251+256"
    vent: "resi 90+91+94+95+97+98+101+102+107+130+158+161+162+165+168+192+193+196+229+232+233+246+251+256"
    # No ligand marks this site, so site/vent name the
    # catalytic residues instead. Narrow them to the
    # reactive atom if you know which it is.
    caver:
      exclude: [HOH, WAT]
      probe_radius: 1.4
      shell_radius: 10
      shell_depth: 6
      clustering_threshold: 3.5
      seed: 1
      # Derived, not written by hand: the centroid of the
      # residues below sits inside an atom, and CAVER then
      # finds zero tunnels without saying why. See
      # channelbridge.caver.cavity_start_point.
      #   chbridge caver config --structure input/enz_GGPPS.pdb \
      #       --start-cavity 90,91,94,95,97,98,101,102,107,130,158,161,162,165,168,192,193,196,229,232,233,246,251,256
  - id: 2
    name: enz_AS                 # AS
    file: input/enz_AS.pdb
    chain: B                       # 3S9V.cif chain A, renamed at prep
    site: "resi 621+622+623+624+625+765+766+767+768+769+770+771+772+773"
    vent: "resi 621+622+623+624+625+765+766+767+768+769+770+771+772+773"
    # No ligand marks this site, so site/vent name the
    # catalytic residues instead. Narrow them to the
    # reactive atom if you know which it is.
    # ChannelsDB branch: the tunnels come from entry 3S9V
    # (6 tunnels, CSA). Nothing is computed, and nothing
    # may move the coordinates -- their chain is in this
    # entry's frame. Where the fetched chain stops before
    # the surface, run_examples re-runs CAVER SEEDED from
    # its buried end; report.tsv's `resolved` column says
    # which of the two produced each row.

# Normalisation is what makes the geometry independent of the CAVER
# build or the database that produced the chain. See
# docs/caver-builds.md for the measurement behind each number.
tunnel:
  normalise: true
  spacing: 1.0
  burial_min: 15
  burial_radius: 8.0
  persist: 2.0
  oic_arm: 1.0

# The published DO coefficients. Nothing here is tuned per pair.
do_coefficients: imars-fig2c

# Left at the package defaults on purpose: this set is for exercising
# the tunnel stages, and a per-pair search grid would be a claim
# about these enzymes that nobody here has earned.

