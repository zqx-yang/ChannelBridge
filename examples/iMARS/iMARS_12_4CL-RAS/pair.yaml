# ChannelBridge pair file -- 4CL (upstream) to RAS (downstream).
#
# GENERATED by run_examples.py from inputs.tsv, enzymes.tsv and
# pairs.tsv; edit those, not this. One of the 19 pairs of the iMARS
# fusion set.
#
# Neither structure is the iMARS construct. The paper's enzymes are
# plant and yeast proteins and almost none has a structure of its
# own, so each side here is a homologous deposited entry or a model:
#   upstream   af3_4CL.cif (af3), superseding the 5BSM of the first structure search
#   downstream afdb_A0A0A7RA06_v6.cif (afdb), superseding the 5FAL of the first structure search
# enzymes.tsv records the search that found the homolog and its
# score, which is how much the homology is worth.
#
# Tunnel source: CAVER for both.

name: iMARS_12_4CL-RAS

# What travels between them: the upstream enzyme's product.
channelled: 4-coumaroyl-CoA

# O_IC is measured at the UPSTREAM exit only, so this is not cosmetic.
upstream: 1

targets:
  - id: 1
    name: enz_4CL                 # 4CL
    file: input/enz_4CL.pdb
    chain: A                       # af3_4CL.cif chain A, renamed at prep
    # Not 5BSM: that is the homolog the first structure
    # search settled on, and this file replaced it.
    site: "resi 210+211+212+213+258+329+330+331+332+352+353+354+355+356+357+358+381+439+441+453+456+547"
    vent: "resi 210+211+212+213+258+329+330+331+332+352+353+354+355+356+357+358+381+439+441+453+456+547"
    # No ligand marks this site, so site/vent name the
    # catalytic residues instead. Narrow them to the
    # reactive atom if you know which it is.
    caver:
      exclude: [HOH, WAT]
      probe_radius: 1.4
      shell_radius: 10
      shell_depth: 6
      clustering_threshold: 3.5
      seed: 1
      # Derived, not written by hand: the centroid of the
      # residues below sits inside an atom, and CAVER then
      # finds zero tunnels without saying why. See
      # channelbridge.caver.cavity_start_point.
      #   chbridge caver config --structure input/enz_4CL.pdb \
      #       --start-cavity 210,211,212,213,258,329,330,331,332,352,353,354,355,356,357,358,381,439,441,453,456,547
    # adenylate-forming; the ATP site is the one annotated
  - id: 2
    name: enz_RAS                 # RAS
    file: input/enz_RAS.pdb
    chain: B                       # afdb_A0A0A7RA06_v6.cif chain A, renamed at prep
    # Not 5FAL: that is the homolog the first structure
    # search settled on, and this file replaced it.
    site: "resi 152+156+157+158+234+247+248+249+250+277+278+279+280+296+324+363+364+365+366+367+368"
    vent: "resi 152+156+157+158+234+247+248+249+250+277+278+279+280+296+324+363+364+365+366+367+368"
    # No ligand marks this site, so site/vent name the
    # catalytic residues instead. Narrow them to the
    # reactive atom if you know which it is.
    caver:
      exclude: [HOH, WAT]
      probe_radius: 1.4
      shell_radius: 10
      shell_depth: 6
      clustering_threshold: 3.5
      seed: 1
      # Derived, not written by hand: the centroid of the
      # residues below sits inside an atom, and CAVER then
      # finds zero tunnels without saying why. See
      # channelbridge.caver.cavity_start_point.
      #   chbridge caver config --structure input/enz_RAS.pdb \
      #       --start-cavity 152,156,157,158,234,247,248,249,250,277,278,279,280,296,324,363,364,365,366,367,368
    # DISTANT homolog (0.52) found at rank 11: weak

# Normalisation is what makes the geometry independent of the CAVER
# build or the database that produced the chain. See
# docs/caver-builds.md for the measurement behind each number.
tunnel:
  normalise: true
  spacing: 1.0
  burial_min: 15
  burial_radius: 8.0
  persist: 2.0
  oic_arm: 1.0

# The published DO coefficients. Nothing here is tuned per pair.
do_coefficients: imars-fig2c

# Left at the package defaults on purpose: this set is for exercising
# the tunnel stages, and a per-pair search grid would be a claim
# about these enzymes that nobody here has earned.

