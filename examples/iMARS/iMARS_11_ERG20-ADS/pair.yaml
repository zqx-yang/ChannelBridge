# ChannelBridge pair file -- ERG20 (upstream) to ADS (downstream).
#
# GENERATED by run_examples.py from inputs.tsv, enzymes.tsv and
# pairs.tsv; edit those, not this. One of the 19 pairs of the iMARS
# fusion set.
#
# Neither structure is the iMARS construct. The paper's enzymes are
# plant and yeast proteins and almost none has a structure of its
# own, so each side here is a homologous deposited entry or a model:
#   upstream   alphafill_P08524.cif (alphafill), superseding the 1FPS of the first structure search
#   downstream alphafill_Q9AR04.cif (alphafill), superseding the 3G4D of the first structure search
# enzymes.tsv records the search that found the homolog and its
# score, which is how much the homology is worth.
#
# Tunnel source: CAVER for both.

name: iMARS_11_ERG20-ADS

# What travels between them: the upstream enzyme's product.
channelled: FPP

# O_IC is measured at the UPSTREAM exit only, so this is not cosmetic.
upstream: 1

targets:
  - id: 1
    name: enz_ERG20                 # ERG20
    file: input/enz_ERG20.pdb
    chain: A                       # alphafill_P08524.cif chain A, renamed at prep
    # Not 1FPS: that is the homolog the first structure
    # search settled on, and this file replaced it.
    ligands: [FPP]
    channel_ligand: FPP
    site: "resn FPP"
    vent: "resn FPP"
    caver:
      exclude: [HOH, WAT, FPP]
      probe_radius: 1.4
      shell_radius: 10
      shell_depth: 6
      clustering_threshold: 3.5
      seed: 1
      # Start point: the centroid of ONE FPP copy, in
      # the chain whose channel this is. Not the mean
      # over copies -- that lands between two sites and
      # in neither. See run_examples._cargo_seed.
  - id: 2
    name: enz_ADS                 # ADS
    file: input/enz_ADS.pdb
    chain: B                       # alphafill_Q9AR04.cif chain A, renamed at prep
    # Not 3G4D: that is the homolog the first structure
    # search settled on, and this file replaced it.
    ligands: [FPP]
    channel_ligand: FPP
    site: "resn FPP"
    vent: "resn FPP"
    caver:
      exclude: [HOH, WAT, FPP]
      probe_radius: 1.4
      shell_radius: 10
      shell_depth: 6
      clustering_threshold: 3.5
      seed: 1
      # Start point: the centroid of ONE FPP copy, in
      # the chain whose channel this is. Not the mean
      # over copies -- that lands between two sites and
      # in neither. See run_examples._cargo_seed.
    # DISTANT homolog (0.41): family-level evidence only; chain B, not
    # A: the 11 annotated CSA tunnels are all in chain B, NONE in chain
    # A

# Normalisation is what makes the geometry independent of the CAVER
# build or the database that produced the chain. See
# docs/caver-builds.md for the measurement behind each number.
tunnel:
  normalise: true
  spacing: 1.0
  burial_min: 15
  burial_radius: 8.0
  persist: 2.0
  oic_arm: 1.0

# The published DO coefficients. Nothing here is tuned per pair.
do_coefficients: imars-fig2c

# Left at the package defaults on purpose: this set is for exercising
# the tunnel stages, and a per-pair search grid would be a claim
# about these enzymes that nobody here has earned.

